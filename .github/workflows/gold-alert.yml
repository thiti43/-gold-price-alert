name: Gold XAUUSD SMA5 Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore last market state
        uses: actions/cache/restore@v4
        with:
          path: .gold_market_state.json
          key: gold-market-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gold-market-state-

     
      - name: Monitor market every second
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          python cloud_once.py


      - name: Save latest market state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gold_market_state.json
          key: gold-market-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start next workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gold-alert.yml --ref main
          echo "Next run requested"
