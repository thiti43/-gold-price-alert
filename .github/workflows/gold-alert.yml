
name: Gold XAUUSD SMA20 Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check gold every 1 minute
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          for i in {1..5}; do
            echo "Checking XAU/USD - Round $i"
            python cloud_once.py
            if [ "$i" -lt 5 ]; then
              sleep 60
            fi
          done
