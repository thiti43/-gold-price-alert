
name: Gold XAUUSD SMA20 Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check gold price
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cloud_once.py
