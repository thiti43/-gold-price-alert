
name: Gold XAUUSD SMA20 Alert

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check gold every 1 minute
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          set -e
          for i in {1..5}; do
            echo "Checking XAU/USD - Round $i"
            python cloud_once.py

            if [ "$i" -lt 5 ]; then
              sleep 60
            fi
          done

      - name: Start next workflow automatically
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gold-alert.yml --ref main
          echo "Next workflow requested successfully"
